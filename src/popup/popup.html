<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>MD Reader</title>
  <style>
    body {
      width: 340px;
      margin: 0;
      padding: 14px;
      font: 13px/1.6 system-ui, "Segoe UI", "Microsoft YaHei", sans-serif;
      color: #1f2328;
    }
    h1 { margin: 0 0 12px; font-size: 14px; }
    fieldset {
      border: 1px solid #d0d7de; border-radius: 7px;
      padding: 10px 12px 12px; margin: 0 0 12px;
    }
    legend { padding: 0 5px; font-size: 12px; color: #656d76; }
    label.field { display: block; font-size: 12px; color: #424a53; margin-bottom: 3px; }
    select,
    input[type="number"] {
      width: 100%; padding: 5px 7px; margin-bottom: 10px;
      font: inherit; font-size: 12px;
      border: 1px solid #d0d7de; border-radius: 6px; background: #fff;
    }
    input[type="number"] {
      display: block; width: 90px; margin-bottom: 0;
    }
    .row { display: flex; gap: 10px; }
    .row > div { flex: 1; min-width: 0; }
    label.check {
      display: flex; align-items: center; gap: 7px;
      margin-top: 2px; font-size: 12px; color: #424a53; cursor: pointer;
    }
    label.check input { margin: 0; }
    fieldset > *:last-child { margin-bottom: 0; }
    .status { padding: 9px 11px; border-radius: 7px; font-size: 12px; line-height: 1.6; }
    .ok  { background: #ddf4e4; border: 1px solid #a7e0be; color: #14663a; }
    .bad { background: #fff8c5; border: 1px solid #d4a72c; color: #4d2d00; }
    ol { margin: 7px 0 0; padding-left: 18px; }
    li { margin-bottom: 4px; }
    code {
      background: #f0f1f3; padding: 1px 5px; border-radius: 4px;
      font: 12px ui-monospace, Consolas, monospace; word-break: break-all; user-select: all;
    }
    .hint { color: #656d76; font-size: 11px; margin-top: 9px; }
    .meta { color: #8c959f; font-size: 11px; margin-top: 10px; }
    .reset-btn {
      display: block; width: 100%; padding: 7px 10px; margin-bottom: 12px;
      font: inherit; font-size: 12px; color: #424a53;
      background: #fff; border: 1px solid #d0d7de; border-radius: 6px; cursor: pointer;
    }
    .reset-btn:hover { background: #f6f8fa; border-color: #8c959f; }
    /* 待确认状态：用黄色提示，避免用户以为是普通按钮而误触第二次 */
    .reset-btn.is-confirming {
      color: #7d4e00; background: #fff8c5; border-color: #d4a72c; font-weight: 600;
    }
  </style>
</head>
<body>
  <h1>MD Reader</h1>

  <fieldset>
    <legend>配色</legend>

    <label class="field" for="mode">颜色模式</label>
    <select id="mode">
      <option value="auto">跟随系统</option>
      <option value="light">始终浅色</option>
      <option value="dark">始终深色</option>
    </select>

    <label class="field" for="lightTheme">浅色代码配色</label>
    <select id="lightTheme"></select>

    <label class="field" for="darkTheme">深色代码配色</label>
    <select id="darkTheme"></select>
  </fieldset>

  <fieldset>
    <legend>排版</legend>

    <div class="row">
      <div>
        <label class="field" for="fontSize">字号</label>
        <select id="fontSize">
          <option value="small">小</option>
          <option value="medium">中</option>
          <option value="large">大</option>
        </select>
      </div>
      <div>
        <label class="field" for="contentWidth">正文宽度</label>
        <select id="contentWidth">
          <option value="narrow">窄</option>
          <option value="medium">中</option>
          <option value="wide">宽</option>
          <option value="full">全宽</option>
        </select>
      </div>
    </div>

    <label class="check">
      <input type="checkbox" id="showToc">
      显示侧边目录
    </label>

    <label class="field" for="foldThreshold">折叠功能阈值</label>
    <input type="number" id="foldThreshold" min="0" max="9999" step="5">
    <div class="hint">
      目录项数量<strong>超过</strong>该值时才显示折叠箭头与批量按钮。短文档一屏就能看完，
      多一排按钮反而是噪音。填 0 表示始终显示。
    </div>

    <label class="field" for="defaultExpandLevel">默认展开层数</label>
    <select id="defaultExpandLevel">
      <option value="-1">全部展开</option>
      <option value="0">只显示第一层</option>
      <option value="1">展开第一层（可见前两层）</option>
      <option value="2">展开前两层（可见前三层）</option>
      <option value="3">展开前三层（可见前四层）</option>
      <option value="4">展开前四层</option>
    </select>
    <div class="hint">
      仅在折叠功能启用时生效，且只决定<strong>初始</strong>状态——之后的手动折叠不会被覆盖。
    </div>
  </fieldset>

  <button type="button" id="reset" class="reset-btn">恢复默认设置</button>

  <div id="status" class="status">正在检测…</div>
  <div id="detail"></div>
  <div class="meta" id="meta"></div>

  <!-- 构建时 popup.html 与 popup.js 会被放进同一个产物目录，所以这里是同目录引用 -->
  <script src="popup.js"></script>
</body>
</html>
