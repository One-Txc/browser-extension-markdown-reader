<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>MD Reader</title>
  <style>
    /*
     * 默认的 content-box 会让 width:100% + padding + border 一起溢出容器 ——
     * 并排的两个控件就是因此重叠的（输入框压到了下拉框上）。
     */
    *, *::before, *::after { box-sizing: border-box; }

    body {
      width: 340px;
      margin: 0;
      padding: 14px;
      font: 13px/1.6 system-ui, "Segoe UI", "Microsoft YaHei", sans-serif;
      color: #1f2328;
    }
    h1 { margin: 0 0 12px; font-size: 14px; }
    fieldset {
      border: 1px solid #d0d7de; border-radius: 7px;
      padding: 10px 12px 12px; margin: 0 0 12px;
    }
    legend { padding: 0 5px; font-size: 12px; color: #656d76; }
    label.field { display: block; font-size: 12px; color: #424a53; margin-bottom: 3px; }
    select,
    input[type="number"] {
      width: 100%; padding: 5px 7px; margin-bottom: 10px;
      font: inherit; font-size: 12px;
      border: 1px solid #d0d7de; border-radius: 6px; background: #fff;
    }
    /* 并排的控件不留底部间距，统一由下方 .hint 控制 */
    .row select,
    .row input[type="number"] {
      display: block;
      /* min-width 不能省：表单控件有基于 size 的内在宽度，会撑破弹性列 */
      min-width: 0;
      margin-bottom: 0;
    }

    /* ---------- 可折叠的「高级设置」分组标题 ---------- */

    .adv-toggle {
      display: inline-flex; align-items: center; gap: 5px;
      padding: 0; border: 0; background: transparent;
      font: inherit; font-size: 12px; font-weight: 600;
      color: #424a53; cursor: pointer;
    }
    .adv-toggle:hover { color: #0969da; }
    .adv-caret {
      display: block; width: 9px; height: 9px;
      transition: transform 0.15s ease;
    }
    .adv-toggle[aria-expanded="true"] .adv-caret { transform: rotate(90deg); }

    /* 收起时不占位，也不参与 Tab 焦点顺序 */
    .adv-body.is-collapsed { display: none; }
    .row { display: flex; gap: 10px; }
    .row > div { flex: 1; min-width: 0; }
    /*
     * 上下都留白：它相邻的是并排控件行，而那类行的底部间距已被归零
     * （见 .row select / .row input），所以间距得由这里自己出。
     */
    label.check {
      display: flex; align-items: center; gap: 7px;
      margin: 10px 0; font-size: 12px; color: #424a53; cursor: pointer;
    }
    label.check input { margin: 0; }
    fieldset > *:last-child { margin-bottom: 0; }
    .status { padding: 9px 11px; border-radius: 7px; font-size: 12px; line-height: 1.6; }
    .ok  { background: #ddf4e4; border: 1px solid #a7e0be; color: #14663a; }
    .bad { background: #fff8c5; border: 1px solid #d4a72c; color: #4d2d00; }
    ol { margin: 7px 0 0; padding-left: 18px; }
    li { margin-bottom: 4px; }
    code {
      background: #f0f1f3; padding: 1px 5px; border-radius: 4px;
      font: 12px ui-monospace, Consolas, monospace; word-break: break-all; user-select: all;
    }
    .hint { color: #656d76; font-size: 11px; margin-top: 9px; }
    .meta { color: #8c959f; font-size: 11px; margin-top: 10px; }
    .reset-btn {
      display: block; width: 100%; padding: 7px 10px; margin-bottom: 12px;
      font: inherit; font-size: 12px; color: #424a53;
      background: #fff; border: 1px solid #d0d7de; border-radius: 6px; cursor: pointer;
    }
    .reset-btn:hover { background: #f6f8fa; border-color: #8c959f; }
    /* 待确认状态：用黄色提示，避免用户以为是普通按钮而误触第二次 */
    .reset-btn.is-confirming {
      color: #7d4e00; background: #fff8c5; border-color: #d4a72c; font-weight: 600;
    }
  </style>
</head>
<body>
  <h1>MD Reader</h1>

  <fieldset>
    <legend data-i18n="popupBasic">基本设置</legend>

    <label class="field" for="mode" data-i18n="popupMode">颜色模式</label>
    <select id="mode">
      <option value="auto" data-i18n="popupModeAuto">跟随系统</option>
      <option value="light" data-i18n="popupModeLight">始终浅色</option>
      <option value="dark" data-i18n="popupModeDark">始终深色</option>
      <option value="eyecare" data-i18n="popupModeEyecare">护眼模式</option>
      <!-- 护眼模式最常用，与上面三项并列；其余配色放进分组，避免下拉过长 -->
      <optgroup data-i18n-label="popupModeOtherGroup" label="其他配色">
        <option value="parchment" data-i18n="popupModeParchment">羊皮纸</option>
        <option value="warmwhite" data-i18n="popupModeWarmWhite">暖白</option>
        <option value="softgray" data-i18n="popupModeSoftGray">柔灰</option>
        <option value="darkwarm" data-i18n="popupModeDarkWarm">暗夜暖调</option>
      </optgroup>
    </select>

    <label class="field" for="lightTheme" data-i18n="popupLightTheme">浅色代码配色</label>
    <select id="lightTheme"></select>

    <label class="field" for="darkTheme" data-i18n="popupDarkTheme">深色代码配色</label>
    <select id="darkTheme"></select>

    <label class="field" for="locale" data-i18n="popupLocale">界面语言</label>
    <select id="locale">
      <option value="auto" data-i18n="popupLocaleAuto">跟随浏览器</option>
      <!-- 语言名用各自的写法，不进语言包 -->
      <option value="zh_CN">简体中文</option>
      <option value="en">English</option>
      <option value="ja">日本語</option>
      <option value="ko">한국어</option>
    </select>

    <label class="check">
      <input type="checkbox" id="showToc">
      <span data-i18n="popupShowSidebar">显示侧边栏</span>
    </label>
  </fieldset>

  <fieldset>
    <!--
      legend 里可以放按钮（button 属于 phrasing content）。
      这样不必为了一个「可折叠的标题」放弃 fieldset 的默认样式。
    -->
    <legend>
      <button type="button" id="advancedToggle" class="adv-toggle" aria-expanded="false"
              aria-controls="advancedBody">
        <svg class="adv-caret" viewBox="0 0 10 10" aria-hidden="true"><path d="M3.5 2 7 5 3.5 8" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span data-i18n="popupAdvanced">高级设置</span>
      </button>
    </legend>

    <div id="advancedBody" class="adv-body">
      <div class="row">
        <div>
          <label class="field" for="fontSize" data-i18n="popupFontSize">字号</label>
          <select id="fontSize">
            <option value="small" data-i18n="popupSizeSmall">小</option>
            <option value="medium" data-i18n="popupSizeMedium">中</option>
            <option value="large" data-i18n="popupSizeLarge">大</option>
          </select>
        </div>
        <div>
          <label class="field" for="contentWidth" data-i18n="popupContentWidth">正文宽度</label>
          <select id="contentWidth">
            <option value="narrow" data-i18n="popupWidthNarrow">窄</option>
            <option value="medium" data-i18n="popupWidthMedium">中</option>
            <option value="wide" data-i18n="popupWidthWide">宽</option>
            <option value="full" data-i18n="popupWidthFull">全宽</option>
          </select>
        </div>
      </div>

      <div class="row">
        <div>
          <label class="field" for="foldThreshold" data-i18n="popupFoldThreshold">折叠阈值</label>
          <input type="number" id="foldThreshold" min="0" max="9999" step="5">
        </div>
        <div>
          <label class="field" for="defaultExpandLevel" data-i18n="popupExpandLevel">默认展开层数</label>
          <select id="defaultExpandLevel">
            <option value="-1" data-i18n="popupExpandAll">全部展开</option>
            <option value="0" data-i18n="popupExpand0">只显示第一层</option>
            <option value="1" data-i18n="popupExpand1">展开第一层</option>
            <option value="2" data-i18n="popupExpand2">展开前两层</option>
            <option value="3" data-i18n="popupExpand3">展开前三层</option>
            <option value="4" data-i18n="popupExpand4">展开前四层</option>
          </select>
        </div>
      </div>
      <div class="hint" data-i18n="popupFoldHint">
        目录项超过阈值时显示折叠按钮（填 0 表示始终显示）；默认展开层数决定打开文档时展开到第几层。
      </div>
    </div>
  </fieldset>

  <button type="button" id="reset" class="reset-btn" data-i18n="popupReset">恢复默认设置</button>

  <div id="status" class="status" data-i18n="popupChecking">正在检测…</div>
  <div id="detail"></div>
  <div class="meta" id="version"></div>
  <div class="meta" id="meta"></div>

  <!-- 构建时 popup.html 与 popup.js 会被放进同一个产物目录，所以这里是同目录引用 -->
  <script src="popup.js"></script>
</body>
</html>
